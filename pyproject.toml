[project]
name = "pixel-agent"
version = "0.1.0"
description = "PIXEL — a pixel-art CLI agent for daily-life commands"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "groq>=1.0",
    "anthropic>=0.30",
    "python-dateutil>=2.9",
]

[project.scripts]
pixel = "pixel_agent.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pixel_agent"]
